services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studybuddy_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=AI StudyBuddy API
      - PROJECT_VERSION=1.0.0
      - DATABASE_URL=sqlite:///./studybuddy.db
      - SECRET_KEY=studybuddy_production_secret_key_college_final_2026_super_secure
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=gemini-3.8-flash
    volumes:
      - studybuddy_data:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: studybuddy_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  studybuddy_data:
